document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ring: 262.1 83.3% 57.8%;\n  --radius: 0.75rem;\n\n  /* Chart palette (5 categorical hues) */\n  --chart-1: 12 76% 61%;\n  --chart-2: 173 58% 39%;\n  --chart-3: 197 37% 24%;\n  --chart-4: 43 74% 66%;\n  --chart-5: 27 87% 67%;\n\n  /* Sidebar surface — slightly off-white in light mode */\n  --sidebar-background: 0 0% 98%;\n  --sidebar-foreground: 240 5.3% 26.1%;\n  --sidebar-primary: 240 5.9% 10%;\n  --sidebar-primary-foreground: 0 0% 98%;\n  --sidebar-accent: 240 4.8% 95.9%;\n  --sidebar-accent-foreground: 262.1 83.3% 57.8%;\n  --sidebar-border: 220 13% 91%;\n  --sidebar-ring: 217.2 91.2% 59.8%;\n\n  /* Logo & ink — wordmark uses a warm near-black */\n  --ink: 25 14% 13%;                     /* #211915 — fill of pausa-logo.svg */\n\n  /* ---------- Typography ---------- */\n  --font-sans: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system,\n    'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;\n  --font-mono: 'Ubuntu Mono', ui-monospace, SFMono-Regular, Menlo, Monaco,\n    'Liberation Mono', 'Courier New', monospace;\n\n  /* Size scale (Tailwind defaults Pausa actually uses) */\n  --text-tiny: 0.6rem;        /* 9.6px — used for very small chips */\n  --text-xs: 0.75rem;         /* 12 */\n  --text-sm: 0.875rem;        /* 14 — default body/UI */\n  --text-base: 1rem;          /* 16 */\n  --text-lg: 1.125rem;        /* 18 — h5 */\n  --text-xl: 1.25rem;         /* 20 — h4 */\n  --text-2xl: 1.5rem;         /* 24 — h3 */\n  --text-3xl: 1.875rem;       /* 30 — h2 / h3 (md) */\n  --text-4xl: 2.25rem;        /* 36 — h1 / h2 (md) */\n  --text-5xl: 3rem;           /* 48 — h1 (md) */\n\n  --leading-tight: 1.25;\n  --leading-normal: 1.5;\n  --leading-relaxed: 1.625;\n\n  /* ---------- Radii ---------- */\n  --radius-sm: calc(var(--radius) - 4px);  /* 8px  */\n  --radius-md: calc(var(--radius) - 2px);  /* 10px */\n  --radius-lg: var(--radius);              /* 12px — default card/button */\n  --radius-xl: 1rem;                       /* 16px */\n  --rad  data-screen-label=\"02\" data-speaker-notes=\"Definición corta de Pausa antes de entrar en el problema.\" style=\"position:relative;background:radial-gradient(circle at 50% 46%, #4d47fb 0%, #4340c8 24%, #3a3c86 50%, #313352 76%, #343748 100%);color:#fff;font-family:'Plus Jakarta Sans',sans-serif;padding:120px;display:flex;flex-direction:column;align-items:center;justify-content:center\" data-om-slide-id=\"ff6e403a\">\n<h2 style=\"font-size:78px;font-weight:800;letter-spacing:-.02em;margin:0;text-align:center\">¿Qué es Pausa?<\u002Fh2>\n<div style=\"background:#eef0ff;border-radius:26px;padding:74px 100px;margin-top:78px;max-width:1280px\">\n<p style=\"font-size:46px;font-weight:700;line-height:1.35;color:#3a35d1;margin:0;text-align:center;text-wrap:pretty\">Una plataforma de gestión creada para ayudar a las organizaciones a trabajar de forma más eficiente y sostenible.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-document-role=\"page\" data-label=\"El problema\" data-screen-label=\"03\" data-speaker-notes=\"Cinco motivos de raíz: falta de claridad de rol, falta de consciencia en el uso del tiempo, exceso de centralización, gestionar desde la percepción y subestimar la reflexión. Cada uno con la frase que escuchamos en los equipos; la de percepción va en rojo porque es la creencia sin datos.\" style=\"position:relative;background:radial-gradient(circle at 50% 46%, #4d47fb 0%, #4340c8 24%, #3a3c86 50%, #313352 76%, #343748 100%);color:#fff;font-family:'Plus Jakarta Sans',sans-serif;display:grid;grid-template-columns:640px 1fr\" data-om-slide-id=\"899c8e89\">\n<img src=\"bc732937-3b3c-4dbe-8fd0-7828c9a8d9e5\" alt=\"Pausa\" style=\"position:absolute;top:60px;right:90px;height:52px;width:104px;display:block;z-index:2\">\n<div style=\"padding:70px 60px 66px 90px;display:flex;flex-direction:column\">\n<span style=\"display:inline-block;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:11px 30px;font-size:21px;font-weight:700;letter-spacing:.14em;color:#fff;align-self:flex-start\">PROBLEMA<\u002Fspan>\n<h2 style=\"font-size:76px;font-weight:800;letter-spacing:-.03em;line-height:1;margin:40px 0 0\">Principales<br>motivos<\u002Fh2>\n<div style=\"height:6px;border-radius:3px;background:#8b8fee;margin-top:26px;width:180px\"><\u002Fdiv>\n<p style=\"font-size:27px;line-height:1.45;color:#c5c9ff;margin:34px 0 0;text-wrap:pretty\">Las raíces del problema que venimos a resolver, y las frases con las que aparecen en los equipos.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#eef0ff;border-radius:38px 0 0 38px;padding:56px 90px 56px 60px;display:flex;flex-direction:column;justify-content:center;gap:26px\">\n<div>\n<p style=\"font-size:34px;font-weight:700;line-height:1.15;letter-spacing:-.015em;color:#1f2260;margin:0;text-wrap:pretty;display:flex;align-items:baseline;gap:16px\"><span style=\"width:11px;height:11px;border-radius:50%;background:#4d47fb;flex:none;transform:translateY(-6px)\"><\u002Fspan>Falta de claridad de rol<\u002Fp>\n<p style=\"font-size:27px;font-weight:500;line-height:1.3;color:#6b70a8;margin:9px 0 0 34px;text-wrap:pretty\">«Me miden por A pero me piden B»<\u002Fp>\n<\u002Fdiv>\n<div style=\"height:1px;background:#d5d8fb\"><\u002Fdiv>\n<div>\n<p style=\"font-size:34px;font-weight:700;line-height:1.15;letter-spacing:-.015em;color:#1f2260;margin:0;text-wrap:pretty;display:flex;align-items:baseline;gap:16px\"><span style=\"width:11px;height:11px;border-radius:50%;background:#4d47fb;flex:none;transform:translateY(-6px)\"><\u002Fspan>Falta de consciencia en el uso del tiempo<\u002Fp>\n<p style=\"font-size:27px;font-weight:500;line-height:1.3;color:#6b70a8;margin:9px 0 0 34px;text-wrap:pretty\">«Se me va el día y no sé en qué» · «Me llenan la agenda con reuniones que no sé para qué son»<\u002Fp>\n<\u002Fdiv>\n<div style=\"height:1px;background:#d5d8fb\"><\u002Fdiv>\n<div>\n<p style=\"font-size:34px;font-weight:700;line-height:1.15;letter-spacing:-.015em;color:#1f2260;margin:0;text-wrap:pretty;display:flex;align-items:baseline;gap:16px\"><span style=\"width:11px;height:11px;border-radius:50%;background:#4d47fb;flex:none;transform:translateY(-6px)\"><\u002Fspan>Exceso de centralización<\u002Fp>\n<p style=\"font-size:27px;font-weight:500;line-height:1.3;color:#6b70a8;margin:9px 0 0 34px;text-wrap:pretty\">«Lo hago yo y listo!»<\u002Fp>\n<\u002Fdiv>\n<div style=\"height:1px;background:#d5d8fb\"><\u002Fdiv>\n<div>\n<p style=\"font-size:34px;font-weight:700;line-height:1.15;letter-spacing:-.015em;color:#1f2260;margin:0;text-wrap:pretty;display:flex;align-items:baseline;gap:16px\"><span style=\"width:11px;height:11px;border-radius:50%;background:#4d47fb;flex:none;transform:translateY(-6px)\"><\u002Fspan>Gestionar desde la percepción<\u002Fp>\n<p style=\"font-size: 27px; font-weight: 600; line-height: 1.3; color: #6B70A8; margin: 9px 0 0 34px; text-wrap: pretty\"><span style=\"font-weight: normal;\">«Creo que le dedico la mayor parte del tiempo a lo importante»<\u002Fspan><\u002Fp>\n<\u002Fdiv>\n<div style=\"height:1px;background:#d5d8fb\"><\u002Fdiv>\n<div>\n<p style=\"font-size:34px;font-weight:700;line-height:1.15;letter-spacing:-.015em;color:#1f2260;margin:0;text-wrap:pretty;display:flex;align-items:baseline;gap:16px\"><span style=\"width:11px;height:11px;border-radius:50%;background:#4d47fb;flex:none;transform:translateY(-6px)\"><\u002Fspan>Subestimar la reflexión y sobrevalorizar la acción<\u002Fp>\n<p style=\"font-size:27px;font-weight:500;line-height:1.3;color:#6b70a8;margin:9px 0 0 34px;text-wrap:pretty\">«La operación me come y no puedo ver el largo plazo» · «Siento que debo todo el tiempo»<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fsection>\n\n<section data-document-role=\"page\" data-label=\"Objetivos\" data-screen-label=\"04\" data-speaker-notes=\"Los seis resultados que perseguimos, agrupados en eficiencia, foco y sostenibilidad. Anclar en el negocio, no en la herramienta.\" style=\"position:relative;background:radial-gradient(circle at 50% 46%, #4d47fb 0%, #4340c8 24%, #3a3c86 50%, #313352 76%, #343748 100%);color:#fff;font-family:'Plus Jakarta Sans',sans-serif;padding:64px 100px 66px;display:flex;flex-direction:column;align-items:center\" data-om-slide-id=\"62109742\">\n<img src=\"28ab4d8a-9539-410a-af5d-08bf6d7771f4\" alt=\"Pausa\" style=\"position:absolute;top:60px;right:90px;height:52px;width:104px;display:block;z-index:2\">\n<span style=\"display:inline-block;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:14px 40px;font-size:26px;font-weight:700;letter-spacing:.14em;color:#fff\">LO QUE QUEREMOS LOGRAR<\u002Fspan>\n<p style=\"font-size:42px;font-weight:800;letter-spacing:-.02em;color:#c5c9ff;margin:30px 0 0;text-align:center\">Eficiencia <span style=\"color:#8b8fee\">·<\u002Fspan> Foco <span style=\"color:#8b8fee\">·<\u002Fspan> Sostenibilidad<\u002Fp>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);grid-auto-flow:column;gap:22px 26px;margin-top:44px;flex:1;min-height:0;width:100%\">\n<div style=\"background:#eef0ff;border-radius:20px;padding:30px 34px;display:flex;gap:24px;align-items:center;min-width:0\">\n<span style=\"width:62px;height:62px;border-radius:16px;background:#fff;border:1px solid #d5d8fb;display:flex;align-items:center;justify-content:center;flex:none\"><svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#3a35d1\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"22 7 13.5 15.5 8.5 10.5 2 17\"><\u002Fpolyline><polyline points=\"16 7 22 7 22 13\"><\u002Fpolyline><\u002Fsvg><\u002Fspan>\n<div style=\"min-width:0\"><h3 style=\"font-size:32px;font-weight:700;color:#1f2260;margin:0;letter-spacing:-.01em;text-wrap:pretty\">Productividad con sentido<\u002Fh3><p style=\"font-size:25px;line-height:1.42;color:#4a4f8a;margin:11px 0 0;text-wrap:pretty\">Más eficiencia. Energía bien invertida en trabajo que tiene propósito para el colaborador y para el equipo.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#eef0ff;border-radius:20px;padding:30px 34px;display:flex;gap:24px;align-items:center;min-width:0\">\n<span style=\"width:62px;height:62px;border-radius:16px;background:#fff;border:1px solid #d5d8fb;display:flex;align-items:center;justify-content:center;flex:none\"><svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#3a35d1\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3v18\"><\u002Fpath><path d=\"M5 7h14\"><\u002Fpath><path d=\"M5 7 2 14h6z\"><\u002Fpath><path d=\"M19 7l-3 7h6z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<div style=\"min-width:0\"><h3 style=\"font-size:32px;font-weight:700;color:#1f2260;margin:0;letter-spacing:-.01em;text-wrap:pretty\">Personas en equilibrio<\u002Fh3><p style=\"font-size:25px;line-height:1.42;color:#4a4f8a;margin:11px 0 0;text-wrap:pretty\">Roles bien calibrados: menos sobrecarga, más satisfacción.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#eef0ff;border-radius:20px;padding:30px 34px;display:flex;gap:24px;align-items:center;min-width:0\">\n<span style=\"width:62px;height:62px;border-radius:16px;background:#fff;border:1px solid #d5d8fb;display:flex;align-items:center;justify-content:center;flex:none\"><svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#3a35d1\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"9.5\" cy=\"7\" r=\"3.5\"><\u002Fcircle><path d=\"M22 21v-2a4 4 0 0 0-3-3.9\"><\u002Fpath><path d=\"M16 3.6a4 4 0 0 1 0 7.8\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<div style=\"min-width:0\"><h3 style=\"font-size:32px;font-weight:700;color:#1f2260;margin:0;letter-spacing:-.01em;text-wrap:pretty\">Trabajo en equipo alineado<\u002Fh3><p style=\"font-size:25px;line-height:1.42;color:#4a4f8a;margin:11px 0 0;text-wrap:pretty\">Todos tiran para el mismo lado con claridad de objetivos.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#eef0ff;border-radius:20px;padding:30px 34px;display:flex;gap:24px;align-items:center;min-width:0\">\n<span style=\"width:62px;height:62px;border-radius:16px;background:#fff;border:1px solid #d5d8fb;display:flex;align-items:center;justify-content:center;flex:none\"><svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#3a35d1\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"6\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"2\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n<div style=\"min-width:0\"><h3 style=\"font-size:32px;font-weight:700;color:#1f2260;margin:0;letter-spacing:-.01em;text-wrap:pretty\">Foco aplicado al negocio<\u002Fh3><p style=\"font-size:25px;line-height:1.42;color:#4a4f8a;margin:11px 0 0;text-wrap:pretty\">Asegurarse que la energía invertida esté dirigida al negocio.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#eef0ff;border-radius:20px;padding:30px 34px;display:flex;gap:24px;align-items:center;min-width:0\">\n<span style=\"width:62px;height:62px;border-radius:16px;background:#fff;border:1px solid #d5d8fb;display:flex;align-items:center;justify-content:center;flex:none\"><svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#3a35d1\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"10\"><\u002Fline><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"4\"><\u002Fline><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"14\"><\u002Fline><\u002Fsvg><\u002Fspan>\n<div style=\"min-width:0\"><h3 style=\"font-size:32px;font-weight:700;color:#1f2260;margin:0;letter-spacing:-.01em;text-wrap:pretty\">Gestión basada en datos<\u002Fh3><p style=\"font-size:25px;line-height:1.42;color:#4a4f8a;margin:11px 0 0;text-wrap:pretty\">Decisiones respaldadas en métricas reales.<\ gap:18px\">\n<p style=\"font-size:25px;line-height:1.45;color:#4a4f8a;margin:0\">Definir el norte de referencia: no un rol perfecto, sino uno vivo y ágil.<\u002Fp>\n<p style=\"font-size:25px;line-height:1.45;color:#4a4f8a;margin:0\">Integrar los objetivos de negocio dentro del rol.<\u002Fp>\n<p style=\"font-size:25px;line-height:1.45;color:#4a4f8a;margin:0\">Rol actual y rol ideal conviviendo en la metodología.<\u002Fp>\n<p style=\"font-size:25px;line-height:1.45;color:#3a35d1;font-weight:600;margin:0\">Sin Rol Vivo no hay desvío. Sin desvío no hay insight.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-radius:16px;overflow:hidden;background:#eaecff;display:flex;flex-direction:column\">\n<div style=\"height:8px;background:#3a35d1\"><\u002Fdiv>\n<div style=\"padding:38px 38px 42px;display:flex;flex-direction:column;flex:1\">\n<span style=\"font-size:48px;font-weight:800;color:#3a35d1;line-height:1\">02<\u002Fspan>\n<h3 style=\"font-size:34px;font-weight:700;color:#1f2260;margin:22px 0 0;line-height:1.2\">Entender el foco<\u002Fh3>\n<div style=\"height:5px;width:120px;border-radius:3px;background:#3a35d1;margin:24px 0 26px\"><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:18px\">\n<p style=\"font-size:25px;line-height:1.45;color:#4a4f8a;margin:0\">Registro consciente: la persona frena y registra dónde estuvo.<\u002Fp>\n<p style=\"font-size:25px;line-height:1.45;color:#4a4f8a;margin:0\">Fuentes: calendario y plataforma, con carga asistida por el agente.<\u002Fp>\n<p style=\"font-size:25px;line-height:1.45;color:#4a4f8a;margin:0\">El cruce con el Rol Vivo revela la brecha real.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-radius:16px;overflow:hidden;background:#eaecff;display:flex;flex-direction:column\">\n<div style=\"height:8px;background:#3a35d1\"><\u002Fdiv>\n<div style=\"padding:38px 38px 42px;display:flex;flex-direction:column;flex:1\">\n<span style=\"font-size:48px;font-weight:800;color:#3a35d1;line-h order-radius:4px;background:#5b9bf8;width:4%;flex:none\"><\u002Fspan><span style=\"font-size:16px;color:#3b82f6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">1.0%<\u002Fspan><\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:12px;margin-top:22px\">\n<div style=\"flex:1;border:1px solid #f6d9b0;background:#fff8ee;border-radius:12px;padding:16px 18px\">\n<p style=\"font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:#a1651a;margin:0\">Operativo<\u002Fp>\n<p style=\"font-size:30px;font-weight:700;color:#a1651a;margin:5px 0 0;line-height:1\">68.6%<span style=\"font-size:16px;font-weight:600\"> / máx 25%<\u002Fspan><\u002Fp><\u002Fdiv>\n<div style=\"flex:1;border:1px solid #f6d9b0;background:#fff8ee;border-radius:12px;padding:16px 18px\">\n<p style=\"font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:#a1651a;margin:0\">Estrategia y liderazgo<\u002Fp>\n<p style=\"font-size:30px;font-weight:700;color:#a1651a;margin:5px 0 0;line-height:1\">4.0%<span style=\"font-size:16px;font-weight:600\"> / mín 50%<\u002Fspan><\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-size:17px;line-height:1.4;color:#a1651a;background:#fff8ee;border:1px solid #f6d9b0;border-radius:12px;padding:12px 16px;margin:12px 0 0\">La brecha entre lo operativo y lo estratégico se amplió por tercer mes consecutivo.<\u002Fp>\n<div style=\"display:flex;align-items:center;gap:9px;margin-top:12px;padding-top:10px;border-top:1px solid #f3f4f6\"><span style=\"width:10px;height:10px;border-radius:50%;background:#3b82f6\"><\u002Fspan><span style=\"font-size:16px;color:#6b7280\">Rolando Mercury<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"border:1px solid #ececf1;border-radius:14px;padding:15px 18px;min-width:0;display:flex;flex-direction:column\">\n<div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:14px\">\n<div><p style=\"font-size:23px;font-weight:700;color:#0f1729;margin:0\">Reporte semanal Pausa<\u002Fp><p style=\"font-size:15px;color:#7c3aed;background:#f5f3ff;border-radius:6px;padding:3px 10px;margin:7px 0 0;display:inline-block\">Reporte general<\u002Fp><\u002Fdiv>\n<span style=\"font-size:15px;color:#9ca3af;white-space:nowrap\">10 ago 2026, 10:13<\u002Fspan><\u002Fdiv>\n<p style=\"font-size:19px;font-weight:700;color:#0f1729;margin:14px 0 0\">Sobre tus objetivos<\u002Fp>\n<p style=\"font-size:17px;line-height:1.45;color:#374151;margin:5px 0 0\">Tu rol define un mínimo de <b>50% en estrategia y liderazgo<\u002Fb> y este mes dedicaste <b>4.0%<\u002Fb>. En paralelo, entre operación diaria y reuniones sin foco te llevaste el <b>68.6%<\u002Fb> de las horas, contra un máximo de 25%.<\u002Fp>\n<p style=\"font-size:19px;font-weight:700;color:#0f1729;margin:12px 0 0\">Patrón detectado<\u002Fp>\n<p style=\"font-size:17px;line-height:1.45;color:#374151;margin:5px 0 0\"><b>El operativo desplaza a la conducción.<\u002Fb> No es una semana puntual: se repite hace tres meses y crece. Cada hora que sube el operativo la perdés en estrategia — el desvío no es de esfuerzo, es de rol.<\u002Fp>\n<p style=\"font-size:19px;font-weight:700;color:#0f1729;margin:12px 0 0\">Siguiente paso<\u002Fp>\n<p style=\"font-size:17px;line-height:1.45;color:#374151;margin:5px 0 0\">Delegá la resolución de incidentes en tu segundo de línea (23 h al mes) y bloqueá dos mañanas fijas para planificación. Con eso llevás estrategia de 4% a ~35% sin sumar una sola hora de trabajo.<\u002Fp>\n<div style=\"display:flex;gap:10px;margin:auto 0 0;padding-top:14px\">\n<span style=\"font-size:16px;font-weight:600;color:#fff;background:#0f1729;border-radius:9px;padding:9px 16px\">Este reporte me aportó valor<\u002Fspan>\n<span style=\"font-size:16px;font-weight:600;color:#fff;background:#0f1729;border-radius:9px;padding:9px 16px\">No me resultó útil<\u002Fspan>\n<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ verEquipo }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;flex-direction:column;height:100%;box-sizing:border-box\">\n<div style=\"display:flex;align-items:center;gap:22px;padding:18px 28px;border-bottom:1px solid #ececf1\">\n<span style=\"font-size:28px;font-weight:600;color:#0f1729\">Mi equipo<\u002Fspan>\n<span style=\"width:1px;height:26px;background:#ececf1\"><\u002Fspan>\n<span style=\"font-size:18px;color:#374151;border:1px solid #ececf1;border-radius:10px;padding:9px 18px\">Semana pasada (3 al 9 de agosto)<\u002Fspan>\n<svg width=\"21\" height=\"21\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6b7280\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-left:auto\"><path d=\"M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<div style=\"padding:20px 28px 22px;flex:1;min-height:0;overflow:hidden\"><div style=\"display:flex;align-items:center;gap:14px\">\n<span style=\"width:48px;height:48px;border-radius:12px;background:#7c3aed;color:#fff;font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none\">OP<\u002Fspan>\n<div><p style=\"font-size:27px;font-weight:700;color:#0f1729;margin:0\">Operaciones<\u002Fp><p style=\"font-size:18px;color:#6b7280;margin:3px 0 0\">Líder: Rolando Mercury<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:13px;margin-top:16px\"><div style=\"border:1px solid #ececf1;border-radius:14px;padding:14px 18px;flex:1\"><p style=\"font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:#6b7280;margin:0;white-space:nowrap\">Promedio diario<\u002Fp><p style=\"font-size:36px;font-weight:700;color:#0f1729;margin:8px 0 0;line-height:1\">5.4h<\u002Fp><\u002Fdiv><div style=\"border:1px solid #ececf1;border-radius:14px;padding:14px 18px;flex:1\"><p style=\"font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:#6b7280;margin:0;white-space:nowrap\">Calidad de registro<\u002Fp><p style=\"font-size:36px;font-weight:700;color:#0f1729;margin:8px 0 0;line-height:1\">0.88h/t<\  sobre el tiempo real, con un agente que acompaña 24/7. Es la base: siempre está.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:34px;background:#eaecff;border-radius:16px;padding:32px 40px\">\n<span style=\"width:64px;height:64px;border-radius:50%;background:#3a35d1;color:#fff;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none\">2<\u002Fspan>\n<h3 style=\"font-size:32px;font-weight:700;color:#1f2260;margin:0;width:420px;flex:none\">Acompañamiento humano<\u002Fh3>\n<p style=\"font-size:26px;line-height:1.45;color:#4a4f8a;margin:0\">Un acompañante especializado trabaja con cada líder. La intensidad baja a medida que madura la adopción.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:34px;background:#eaecff;border-radius:16px;padding:32px 40px\">\n<span style=\"width:64px;height:64px;border-radius:50%;background:#3a35d1;color:#fff;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none\">3<\u002Fspan>\n<h3 style=\"font-size:32px;font-weight:700;color:#1f2260;margin:0;width:420px;flex:none\">Alto valor agregado<\u002Fh3>\n<p style=\"font-size:26px;line-height:1.45;color:#4a4f8a;margin:0\">Intervenciones, talleres y programas, y consultoría a la dirección. Se activan cuando la organización los necesita.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection><section data-document-role=\"page\" data-label=\"Pausa Core (2 planes)\" data-screen-label=\"09\" data-speaker-notes=\"Versión simplificada: dos planes. Colaborador 15 USD y Líder 60 USD, que unifica equipo y organización.\" style=\"position:relative;background:#fff;color:#1f2260;font-family:'Plus Jakarta Sans',sans-serif;padding:70px 96px;display:flex;flex-direction:column\" data-om-slide-id=\"9beffb2c\">\n<div style=\"width:fit-content\">\n<p style=\"font-size:22px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#8b8fd6;margin:0 0 12px\">Parte 1 · Tecnología<\u002Fp> =\"font-size:24px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#3a35d1;margin:0\">Líderes<\u002Fp>\n<p style=\"font-size:25px;color:#4a4f8a;margin:10px 0 0\">Para líderes<br><\u002Fp>\n<\u002Fdiv>\n<div style=\"padding:24px 34px 26px;display:flex;flex-direction:column;flex:1\">\n<sc-if value=\"{{ mostrarPrecios }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;align-items:baseline;gap:12px\"><span style=\"font-size:60px;font-weight:800;letter-spacing:-.03em;line-height:1;color:#1f2260\">$60<\u002Fspan><span style=\"font-size:23px;color:#4a4f8a;font-weight:500;line-height:1.25\">por líder / mes<\u002Fspan><\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"height:1px;background:#d5d8fb;margin:22px 0 20px\"><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:11px\">\n<p style=\"font-size:24px;line-height:1.35;color:#4a4f8a;margin:0;font-weight:600\">Todo lo de Individuo +<\u002Fp>\n<div style=\"display:flex;gap:12px;align-items:flex-start\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#3a35d1\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:4px\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><p style=\"font-size:25px;line-height:1.4;color:#4a4f8a;margin:0\">Dashboard de equipo: dato agregado e individual<\u002Fp><\u002Fdiv>\n<div style=\"display:flex;gap:12px;align-items:flex-start\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#3a35d1\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:4px\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><p style=\"font-size:25px;line-height:1.4;color:#4a4f8a;margin:0\">Alineación de roles y objetivos<\u002Fp><\u002Fdiv>\n<div style=\"display:flex;gap:12px;align-items:flex-start\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#3a35d1\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:4px\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><p style=\"font-size:25px;line-height:1.4;color:#4a4f8a;margin:0\">Detección de desvíos y foco semanal del equipo<\u002Fp><\u002Fdiv>\n<div style=\"display:flex;gap:12px;align-items:flex-start\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#3a35d1\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:4px\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><p style=\"font-size:25px;line-height:1.4;color:#4a4f8a;margin:0\">Insights compartidos + conversaciones data-céntricas con el equipo<\u002Fp><\u002Fdiv>\n<div style=\"display:flex;gap:12px;align-items:flex-start\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#3a35d1\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:4px\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><p style=\"font-size:25px;line-height:1.4;color:#4a4f8a;margin:0\">Agente con sugerencia de acciones de liderazgo<\u002Fp><\u002Fdiv>\n<div style=\"display:flex;gap:12px;align-items:flex-start\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#3a35d1\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:4px\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><p style=\"font-size:25px;line-height:1.4;color:#4a4f8a;margin:0\">Tablero organizacional desagregado por equipo<\u002Fp><\u002Fdiv>\n<div style=\"display:flex;gap:12px;align-items:flex-start\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#3a35d1\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:4px\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><p style=\"font-size:25px;line-height:1.4;color:#4a4f8a;margin:0\">Early access a nuevas funcionalidades<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-size:24px;line-height:1.4;color:#4a4f8a;margin:20px 0 0\">Cada plan incluye un volumen de uso del agente. El excedente se factura aparte según consumo.<\u002Fp>\n<\u002Fsection>\n\n<section data-document-role=\"page\" data-label=\"Acompañamiento\" data-screen-label=\"10\" data-speaker-notes=\"Parte 2: el acompañamiento humano. Onboarding 2 meses, consolidación 4 meses y sostenibilidad sin fin de período, más sesiones ad hoc.\" style=\"position:relative;background:#fff;color:#1f2260;font-family:'Plus Jakarta Sans',sans-serif;padding:64px 96px;display:flex;flex-direction:column\" data-om-slide-id=\"1d7515e4\">\n<div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:40px\">\n<div style=\"width:fit-content\">\n<p style=\"font-size:22px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#8b8fd6;margin:0 0 12px\">Parte 2 · Consultoría y acompañamiento<\u002Fp>\n<h2 style=\"font-size:56px;font-weight:800;letter-spacing:-.02em;color:#3a35d1;margin:0\">Implementación<\u002Fh2>\n<div style=\"height: 8px; border-radius: 3px; background: #4d47fb; margin-top: 14px; width: 436px\"><\u002Fdiv>\n<\u002Fdiv>\n<img src=\"bc732937-3b3c-4dbe-8fd0-7828c9a8d9e5\" alt=\"Pausa\" style=\"position:absolute;top:60px;right:90px;height:52px;width:104px;display:block;z-index:2\">\n<\u002Fdiv>\n<p style=\"font-size: 26px; line-height: 1.45; color: #4a4f8a; margin: 20px 0 0; max-width: none; width: auto; white-space: nowrap\">Un acompañante especializado en la metodología trabaja con cada líder. La intensidad baja a medida que la adopción madura.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin:auto 0;align-items:stretch\">\n<div style=\"border-radius:16px;overflow:hidden;background:# -direction:column\">\n<p style=\"font-size:21px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8b8fd6;margin:0\">Fase 1<\u002Fp>\n<p style=\"font-size:25px;font-weight:700;color:#1f2260;margin:8px 0 0\">Mes 1 a 5<\u002Fp>\n<p style=\"font-size:56px;font-weight:800;color:#1f2260;margin:20px 0 0;line-height:1\">{{ mes2F1 }}<span style=\"display:block;margin-top:10px;font-size:22px;font-weight:600;color:#4a4f8a\">USD / mes<\u002Fspan><\u002Fp>\n<p style=\"font-size:20px;line-height:1.35;color:#8b8fd6;margin:12px 0 0\">Core + implementación<\u002Fp>\n<p style=\"font-size:26px;font-weight:700;color:#3a35d1;margin:24px 0 0;padding-top:18px;border-top:1px solid #e4e6fc\">310 USD por líder / mes<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#fff;border-radius:16px;padding:32px 30px;display:flex;flex-direction:column\">\n<p style=\"font-size:21px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8b8fd6;margin:0\">Fase 2<\u002Fp>\n<p style=\"font-size:25px;font-weight:700;color:#1f2260;margin:8px 0 0\">Mes 6 a 12<\u002Fp>\n<p style=\"font-size:56px;font-weight:800;color:#1f2260;margin:20px 0 0;line-height:1\">{{ mes2F2 }}<span style=\"display:block;margin-top:10px;font-size:22px;font-weight:600;color:#4a4f8a\">USD / mes<\u002Fspan><\u002Fp>\n<p style=\"font-size:20px;line-height:1.35;color:#8b8fd6;margin:12px 0 0\">Core + ongoing<\u002Fp>\n<p style=\"font-size:26px;font-weight:700;color:#3a35d1;margin:24px 0 0;padding-top:18px;border-top:1px solid #e4e6fc\">130 USD por líder / mes<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#221a5e;border-radius:16px;padding:32px 30px;display:flex;flex-direction:column\">\n<p style=\"font-size:21px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#a7abf5;margin:0\">Fase 3<\u002Fp>\n<p style=\"font-size:25px;font-weight:700;color:#fff;margin:8px 0 0\">Post mes 12<\u002Fp>\n<p style=\"font-size:56px;font-weight:800;color:#fff;margin:20px 0 0;line-height:1\">{{ mes2F3 }}<span style=\"display:block;margin-top:10px;font-size:22px;font-weight:600;color:#a7abf5\">USD / mes<\u002Fspan><\u002Fp>\n<p style=\"font-size:20px;line-height:1.35;color:#a7abf5;margin:12px 0 0\">Solo plataforma<\u002Fp>\n<p style=\"font-size:26px;font-weight:700;color:#fff;margin:24px 0 0;padding-top:18px;border-top:1px solid #4a4290\">60 USD por líder / mes<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-size:23px;line-height:1.4;color:#4a4f8a;margin:18px 0 0;padding-top:16px;border-top:1px solid #e4e6fc\">Valores en USD. Implementación de 250 USD y ongoing de 70 USD se aplican por líder acompañado. Compromiso mínimo de 12 meses.<\u002Fp>\n<\u002Fsection>\n\n\n<section data-document-role=\"page\" data-label=\"Próximos pasos\" data-screen-label=\"14\" data-speaker-notes=\"Cerrar con acuerdos concretos y fecha de kick-off.\" style=\"position:relative;background:radial-gradient(circle at 50% 46%, #4d47fb 0%, #4340c8 24%, #3a3c86 50%, #313352 76%, #343748 100%);color:#fff;font-family:'Plus Jakarta Sans',sans-serif;padding:76px 110px;display:flex;flex-direction:column\" data-om-slide-id=\"e687aeb9\">\n<img src=\"28ab4d8a-9539-410a-af5d-08bf6d7771f4\" alt=\"Pausa\" style=\"position:absolute;top:60px;right:90px;height:52px;width:104px;display:block;z-index:2\">\n<h2 style=\"font-size:62px;font-weight:800;letter-spacing:-.02em;text-align:center;margin:0\">Próximos pasos<\u002Fh2>\n<div style=\"display:flex;flex-direction:column;gap:24px;margin-top:64px;flex:1;justify-content:center;max-width:1400px;width:100%;align-self:center\">\n<div style=\"display:flex;align-items:center;gap:32px;background:#eef0ff;border-radius:18px;padding:32px 40px\">\n<span style=\"width:60px;height:60px;border-radius:50%;background:#3a35d1;color:#fff;font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none\">1<\u002Fspan>\n<div><h3 style=\"font-size:34px;font-weight:700;color:#1f2260;margin:0\">Definición del alcance y del paquete<\u002Fh3><p style=\"font-size:25px;color:#4a4f8a;margin:8px 0 0\">Cuántos líderes y colaboradores entran, y con qué combo arrancamos.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:32px;background:#eef0ff;border-radius:18px;padding:32px 40px\">\n<span style=\"width:60px;height:60px;border-radius:50%;background:#3a35d1;color:#fff;font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none\">2<\u002Fspan>\n<div><h3 style=\"font-size:34px;font-weight:700;color:#1f2260;margin:0\">Aprobación de la tecnología<\u002Fh3><p style=\"font-size:25px;color:#4a4f8a;margin:8px 0 0\">Revisión de seguridad e integración con calendario.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:32px;background:#221a5e;border-radius:18px;padding:32px 40px\">\n<span style=\"width:60px;height:60px;border-radius:50%;background:#4d47fb;color:#fff;font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none\">3<\u002Fspan>\n<div><h3 style=\"font-size:34px;font-weight:700;color:#fff;margin:0\">Lanzamiento e inicio del onboarding<\u002Fh3><p style=\"font-size:25px;color:#c5c9ff;margin:8px 0 0\">Arranca el proceso individual de cada líder con su acompañante.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fsection>\n\n<section data-document-role=\"page\" data-label=\"Cierre\" data-screen-label=\"15\" data-speaker-notes=\"Cierre.\" style=\"position:relative;background:radial-gradient(circle at 50% 46%, #4d47fb 0%, #4340c8 24%, #3a3c86 50%, #313352 76%, #343748 100%);color:#fff;font-family:'Plus Jakarta Sans',sans-serif;padding:120px;display:flex;flex-direction:column;align-items:center;justify-content:center\" data-om-slide-id=\"98845fbe\">\n<h2 style=\"font-size:96px;font-weight:800;letter-spacing:-.02em;margin:0;text-align:center\">¡Gracias!<\u002Fh2>\n<img src=\"28ab4d8a-9539-410a-af5d-08bf6d7771f4\" alt=\"Pausa\" style=\"height:110px;width:220px;display:block;margin:80px 0 0\">\n<\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;mostrarPrecios&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Contenido&quot;},&quot;mostrarValidar&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Contenido&quot;}}\">\nclass Component extends DCLogic {\n  state = { nColab: 45, nLideres: 6, nDirectores: 2, demo: 0 };\n  DEMO = ['verRol', 'verPanel', 'verReflexion', 'verReportes', 'verInsight', 'verEquipo'];\n  irPaso(p, e) { this.stop(e); this.setState({ demo: (p - 1) * 2 }); }\n  moverDemo(d, e) { this.stop(e); this.setState(s => ({ demo: (s.demo + d + 6) % 6 })); }\n  stop(e) {\n    if (!e) return;\n    e.preventDefault();\n    e.stopPropagation();\n    if (e.nativeEvent && e.nativeEvent.stopImmediatePropagation) e.nativeEvent.stopImmediatePropagation();\n  }\n  verPantalla(n, e) { this.stop(e); this.setState({ demo: n, reflexion: false }); }\n  bump(k, d, min, e) {\n    this.stop(e);\n    this.setState(s => ({ [k]: Math.max(min, s[k] + d) }));\n  }\n  bump2(k, d, def, e) {\n    this.stop(e);\n    this.setState(s => ({ [k]: Math.max(0, (s[k] ?? def) + d) }));\n  }\n  c2(sfx = '', defL = 5) {\n    const col = this.state['n2Colab' + sfx] ?? 45;\n    const lid = this.state['n2Lideres' + sfx] ?? defL;\n    const core = col * 15 + lid * 60;\n    const impl = lid * 250;\n    const ong = lid * 70;\n    const f1 = core + impl, f2 = core + ong, f3 = core;\n    return { core, impl, ong, f1, f2, f3, a1: f1 * 5 + f2 * 7, a2: f3 * 12 };\n  }\n  renderVals() {\n    const { nColab, nLideres, nDirectores } = this.state;\n    const fmt = n => n.toLocaleString('es-AR');\n    const core = nColab * 15 + nLideres * 60 + nDirectores * 110;\n    const acomp = nLideres + nDirectores;\n    const impl = acomp * 250;\n    const ongoing = acomp * 70;\n    const mesImpl = core + impl;\n    const mesOngoing = core + ongoing;\n    const d = this.state.demo;\n    const pasoActivo = Math.floor(d / 2) + 1;\n    return {\n      verRol: d === 0, verPanel: d === 1, verAgenda: d === 2,\n      verReporte: d === 3, verInsight: d === 4, verEquipo: d === 5,\n      noverRol: d !== 0, noverPanel: d !== 1, noverAgenda: d !== 2,\n      noverReporte: d !== 3, noverInsight: d !== 4, noverEquipo: d !== 5,\n      paso1: pasoActivo === 1, paso2: pasoActivo === 2, paso3: pasoActivo === 3,\n      ir1: e => this.irPaso(1, e), ir2: e => this.irPaso(2, e), ir3: e => this.irPaso(3, e),\n      irRol: e => this.verPantalla(0, e), irPanel: e => this.verPantalla(1, e),\n      irAgenda: e => this.verPantalla(2, e), irReporte: e => this.verPantalla(3, e),\n      irInsight: e => this.verPantalla(4, e), irEquipo: e => this.verPantalla(5, e),\n      nColab, nLideres, nDirectores,\n      frenar: e => this.stop(e),\n      g1: this.state.grupo === 1, ng1: this.state.grupo !== 1,\n      g2: this.state.grupo === 2, ng2: this.state.grupo !== 2,\n      g3: this.state.grupo === 3, ng3: this.state.grupo !== 3,\n      tg1: e => { this.stop(e); this.setState(s => ({ grupo: s.grupo === 1 ? null : 1 })); },\n      tg2: e => { this.stop(e); this.setState(s => ({ grupo: s.grupo === 2 ? null : 2 })); },\n      tg3: e => { this.stop(e); this.setState(s => ({ grupo: s.grupo === 3 ? null : 3 })); },\n      g4: this.state.grupo === 4, ng4: this.state.grupo !== 4,\n      g5: this.state.grupo === 5, ng5: this.state.grupo !== 5,\n      tg4: e => { this.stop(e); this.setState(s => ({ grupo: s.grupo === 4 ? null : 4 })); },\n      tg5: e => { this.stop(e); this.setState(s => ({ grupo: s.grupo === 5 ? null : 5 })); },\n      repGeneral: d === 3 && this.state.repTab !== 'evolutivo',\n      repEvolutivo: d === 3 && this.state.repTab === 'evolutivo',\n      verGeneral: e => { this.stop(e); this.setState({ repTab: 'general' }); },\n      verEvolutivo: e => { this.stop(e); this.setState({ repTab: 'evolutivo' }); },\n      verReflexionModal: d === 2 && !!this.state.reflexion,\n      abrirReflexion: e => {\n        this.stop(e);\n        const d = (e && e.currentTarget && e.currentTarget.dataset) || {};\n        this.setState({ reflexion: true, ref: {\n          titulo: d.titulo || '', fecha: d.fecha || '', desde: d.desde || '',\n          hasta: d.hasta || '', dur: d.dur || '', macro: d.macro || ''\n        } });\n      },\n      refTitulo: (this.state.ref || {}).titulo || '',\n      refFecha: (this.state.ref || {}).fecha || '',\n      refDesde: (this.state.ref || {}).desde || '',\n      refHasta: (this.state.ref || {}).hasta || '',\n      refDur: (this.state.ref || {}).dur || '',\n      refMacro: (this.state.ref || {}).macro || '',\n      cerrarReflexion: e => { this.stop(e); this.setState({ reflexion: false }); },\n      menosColab: e => this.bump('nColab', -5, 0, e),\n      masColab: e => this.bump('nColab', 5, 0, e),\n      menosLideres: e => this.bump('nLideres', -1, 0, e),\n      masLideres: e => this.bump('nLideres', 1, 0, e),\n      menosDirectores: e => this.bump('nDirectores', -1, 0, e),\n      masDirectores: e => this.bump('nDirectores', 1, 0, e),\n      n2Colab: this.state.n2Colab ?? 45,\n      n2Lideres: this.state.n2Lideres ?? 5,\n      menosC2: e => this.bump2('n2Colab', -5, 45, e),\n      masC2: e => this.bump2('n2Colab', 5, 45, e),\n      menosL2: e => this.bump2('n2Lideres', -1, 5, e),\n      masL2: e => this.bump2('n2Lideres', 1, 5, e),\n      core2: fmt(this.c2().core), impl2: fmt(this.c2().impl), ong2: fmt(this.c2().ong),\n      mes2F1: fmt(this.c2().f1), mes2F2: fmt(this.c2().f2), mes2F3: fmt(this.c2().f3),\n      anio1: fmt(this.c2().a1), anio2: fmt(this.c2().a2), prom1: fmt(Math.round(this.c2().a1 / 12)),\n      n2ColabB: this.state.n2ColabB ?? 45,\n      n2LideresB: this.state.n2LideresB ?? 10,\n      menosC2B: e => this.bump2('n2ColabB', -5, 45, e),\n      masC2B: e => this.bump2('n2ColabB', 5, 45, e),\n      menosL2B: e => this.bump2('n2LideresB', -1, 10, e),\n      masL2B: e => this.bump2('n2LideresB', 1, 10, e),\n      core2B: fmt(this.c2('B', 10).core), impl2B: fmt(this.c2('B', 10).impl), ong2B: fmt(this.c2('B', 10).ong),\n      mes2F1B: fmt(this.c2('B', 10).f1), mes2F2B: fmt(this.c2('B', 10).f2), mes2F3B: fmt(this.c2('B', 10).f3),\n      anio1B: fmt(this.c2('B', 10).a1), anio2B: fmt(this.c2('B', 10).a2), prom1B: fmt(Math.round(this.c2('B', 10).a1 / 12)),\n      core: fmt(core), impl: fmt(impl), ongoing: fmt(ongoing),\n      mesImpl: fmt(mesImpl), mesOngoing: fmt(mesOngoing),\n      total: fmt(mesImpl * 5 + mesOngoing * 7),\n      mostrarPrecios: this.props.mostrarPrecios ?? true,\n      mostrarValidar: this.props.mostrarValidar ?? true\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
