  @media (prefers-reduced-motion: reduce) {

<header class="as-header">

<main id="as-app">
  <section class="as-cover">
    <div class="as-cover-in">

      <h1>Grupo Don Mario</h1>

      <p data-t="introDos"></p>
      <ul>
        <li data-t="introA"></li>
        <li data-t="introB"></li>
      </ul>
    </div>
  </section>

  <form class="as-main" id="as-form" novalidate>
    <section class="as-card as-how">
      <h2 data-t="howTitle"></h2>
      <p data-t="howText"></p>
    </section>

    <section class="as-card">
      <div class="as-field">
        <label class="as-label" for="as-nombre"><span data-t="nameLabel"></span> <small data-t="required"></small></label>
        <input class="as-input" id="as-nombre" name="nombre" type="text" autocomplete="name" aria-describedby="as-nombre-error" required>
        <p class="as-field-error" id="as-nombre-error" data-t="nameError" hidden></p>

      <div class="as-field">
        <label class="as-label" for="as-intro"><span data-t="introQ"></span> <small data-t="optional"></small></label>

    <div id="as-avenidas"></div>

    <div class="as-send" id="as-send">

        <span id="as-progress-text"></span>
        <div class="as-progress-track" aria-hidden="true"><span id="as-progress-bar"></span></div>
      </div>
      <button class="as-btn" type="submit" id="as-submit"></button>
      <div class="as-notice aviso" id="as-pend" role="status" hidden>

        <button class="as-btn-ghost" type="button" id="as-pend-enviar" data-t="sendAnyway"></button>
      </div>
      <div class="as-notice error" id="as-error" role="alert" hidden>
        <p data-t="sendError"></p>
        <button class="as-btn-ghost" type="button" id="as-reintentar" data-t="retry"></button>
      </div>
    </div>
  </form>
</main>

  var TOTAL = AVENIDAS.reduce(function (s, a) { return s + a.items.length; }, 0);

  var form = document.getElementById('as-form');
  var contAvenidas = document.getElementById('as-avenidas');
  var inputNombre = document.getElementById('as-nombre');
  var inputIntro = document.getElementById('as-intro');
  var errorNombre = document.getElementById('as-nombre-error');
  var btnSubmit = document.getElementById('as-submit');
  var avisoPend = document.getElementById('as-pend');
  var avisoError = document.getElementById('as-error');

  var estado = { nombre: '', intro: '', puntajes: {}, libres: {} };
  var idioma = elegirIdioma();
  var enviando = false;
  var confirmoPendientes = false;

  // ---------- Idioma ----------
  // ?lang=en|pt manda (para compartir el link ya en el idioma de quien responde);
  // si no, el último elegido en este navegador, y si no, el del navegador.
  function elegirIdioma() {
    var q = new URLSearchParams(location.search).get('lang');
    if (IDIOMAS.indexOf(q) >= 0) return q;
    var guardado = leer('pausa-assessment-idioma');
    if (IDIOMAS.indexOf(guardado) >= 0) return guardado;
    var nav = (navigator.language || 'es').slice(0, 2).toLowerCase();
    return IDIOMAS.indexOf(nav) >= 0 ? nav : 'es';
  }

  function t(clave, vars) {
    var s = TEXTOS[idioma][clave];
    if (vars) Object.keys(vars).forEach(function (k) { s = s.replace('{' + k + '}', vars[k]); });
    return s;
  }

  function cambiarIdioma(nuevo) {
    if (nuevo === idioma) return;
    idioma = nuevo;
    escribir('pausa-assessment-idioma', idioma);
    var url = new URL(location.href);
    if (idioma === 'es') url.searchParams.delete('lang'); else url.searchParams.set('lang', idioma);
    history.replaceState(null, '', url);
    pintarTextos();
    pintarAvenidas();
  }

  document.getElementById('as-lang').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-lang]');
    if (b) cambiarIdioma(b.getAttribute('data-lang'));
  });

  function pintarTextos() {
    document.documentElement.lang = idioma;
    document.title = t('title');
    document.getElementById('as-lang').setAttribute('aria-label', t('langLabel'));
    document.querySelectorAll('#as-lang button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === idioma));
    });
    document.querySelectorAll('[data-t]').forEach(function (el) {
      el.textContent = t(el.getAttribute('data-t'));
    });
    btnSubmit.textContent = enviando ? t('sending') : t('submit');
    pintarProgreso();
  }

  // ---------- Preguntas ----------
  function el(tag, attrs, hijos) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (hijos || []).forEach(function (h) { if (h) n.appendChild(h); });
    return n;
  }

  function pintarAvenidas() {
    contAvenidas.textContent = '';
    AVENIDAS.forEach(function (av, i) {
      var card = el('section', { 'class': 'as-card', 'aria-labelledby': 'as-av-' + i });
      card.appendChild(el('h2', { id: 'as-av-' + i }, [
        el('span', { 'class': 'as-card-num', text: String(i + 1) + ' / ' + AVENIDAS.length }),
        document.createTextNode(av.titulo[idioma])
      ]));

      av.items.forEach(function (it) {
        var fs = el('fieldset', { 'class': 'as-item', 'data-entry': it.entry });
        fs.appendChild(el('legend', { text: it.texto[idioma] }));
        if (it.senales) {
          var p = el('p', { 'class': 'as-signals' }, [el('strong', { text: t('signals') })]);
          p.appendChild(document.createTextNode(' ' + it.senales[idioma]));
          fs.appendChild(p);
        }
        var escala = el('div', { 'class': 'as-scale' });
        ESCALA.forEach(function (v) {
          var esNs = v === 'NS';
          var input = el('input', { type: 'radio', name: it.entry, value: v });
          if (esNs) input.setAttribute('aria-label', t('nsLong'));
          if (estado.puntajes[it.entry] === v) input.checked = true;
          escala.appendChild(el('label', { 'class': 'as-opt' + (esNs ? ' ns' : ''), title: esNs ? t('nsLong') : v }, [
            input,
            el('span', { 'aria-hidden': esNs ? 'true' : 'false', text: esNs ? t('ns') : v })
          ]));
        });
        fs.appendChild(escala);
        fs.appendChild(el('div', { 'class': 'as-scale-ends', 'aria-hidden': 'true' }, [
          el('span', { text: t('low') }),
          el('span', { text: t('high') }),
          el('span', { text: t('nsLong') })
        ]));
        var limpiar = el('button', { type: 'button', 'class': 'as-clear', 'data-limpiar': it.entry, text: t('clear') });
        if (!estado.puntajes[it.entry]) limpiar.hidden = true;
        fs.appendChild(limpiar);
        card.appendChild(fs);
      });

      if (av.libre) {
        var id = 'as-libre-' + i;
        var area = el('textarea', { 'class': 'as-textarea', id: id, name: av.libre, rows: '3', placeholder: t('freePh') });
        area.value = estado.libres[av.libre] || '';
        card.appendChild(el('div', { 'class': 'as-field as-free' }, [
          el('label', { 'class': 'as-label', 'for': id }, [
            document.createTextNode(t('free', { avenida: av.titulo[idioma] }) + ' '),
            el('small', { text: t('optional') })
          ]),
          area
        ]));
      }
      contAvenidas.appendChild(card);
    });
    marcarPendientes();
  }

  function respondidas() {
    return Object.keys(estado.puntajes).filter(function (k) { return estado.puntajes[k]; }).length;
  }

  function pintarProgreso() {
    var n = respondidas();
    document.getElementById('as-progress-text').textContent = t('progress', { n: n, t: TOTAL });
    document.getElementById('as-progress-bar').style.width = (n / TOTAL * 100) + '%';
    if (!avisoPend.hidden) {
      var falta = TOTAL - n;
      if (falta === 0) avisoPend.hidden = true;
      else document.getElementById('as-pend-text').textContent = falta === 1 ? t('pendOne') : t('pendMany', { n: falta });
    }
  }

  // Resalta las afirmaciones sin responder solo después de un intento de envío.
  function marcarPendientes() {
    var mostrar = !avisoPend.hidden;
    contAvenidas.querySelectorAll('.as-item').forEach(function (fs) {
      fs.classList.toggle('as-item-pend', mostrar && !estado.puntajes[fs.getAttribute('data-entry')]);
    });
  }

  // ---------- Estado y borrador ----------
  function leer(clave) { try { return localStorage.getItem(clave); } catch (e) { return null; } }
  function escribir(clave, valor) { try { localStorage.setItem(clave, valor); } catch (e) { /* sin storage: sigue andando */ } }
  function borrar(clave) { try { localStorage.removeItem(clave); } catch (e) { /* idem */ } }

  function guardarBorrador() { escribir(CLAVE_BORRADOR, JSON.stringify(estado)); }

  function cargarBorrador() {
    try {
      var b = JSON.parse(leer(CLAVE_BORRADOR) || 'null');
      if (b && typeof b === 'object') {
        estado.nombre = b.nombre || '';
        estado.intro = b.intro || '';
        estado.puntajes = b.puntajes || {};
        estado.libres = b.libres || {};
      }
    } catch (e) { /* borrador corrupto: se ignora */ }
    inputNombre.value = estado.nombre;
    inputIntro.value = estado.intro;
  }

  form.addEventListener('change', function (e) {
    var x = e.target;
    if (x.type === 'radio') {
      estado.puntajes[x.name] = x.value;
      var limpiar = form.querySelector('[data-limpiar="' + x.name + '"]');
      if (limpiar) limpiar.hidden = false;
      x.closest('.as-item').classList.remove('as-item-pend');
      guardarBorrador();
      pintarProgreso();
    }
  });

  form.addEventListener('input', function (e) {
    var x = e.target;
    if (x === inputNombre) {
      estado.nombre = x.value;
      if (x.value.trim()) { errorNombre.hidden = true; x.removeAttribute('aria-invalid'); }
    } else if (x === inputIntro) {
      estado.intro = x.value;
    } else if (x.tagName === 'TEXTAREA') {
      estado.libres[x.name] = x.value;
    } else return;
    guardarBorrador();
  });

  form.addEventListener('click', function (e) {
    var b = e.target.closest('[data-limpiar]');
    if (!b) return;
    var entry = b.getAttribute('data-limpiar');
    delete estado.puntajes[entry];
    form.querySelectorAll('input[name="' + entry + '"]').forEach(function (r) { r.checked = false; });
    b.hidden = true;
    guardarBorrador();
    pintarProgreso();
  });

  // ---------- Envío ----------
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    intentarEnvio();
  });

  document.getElementById('as-pend-revisar').addEventListener('click', function () {
    var primera = contAvenidas.querySelector('.as-item-pend');
    if (primera) {
      primera.scrollIntoView({ behavior: 'smooth', block: 'center' });
      var r = primera.querySelector('input');
      if (r) r.focus({ preventScroll: true });
    }
  });
  document.getElementById('as-pend-enviar').addEventListener('click', function () {
    confirmoPendientes = true;
    intentarEnvio();
  });
  document.getElementById('as-reintentar').addEventListener('click', function () { intentarEnvio(); });

  function intentarEnvio() {
    if (enviando) return;
    if (!estado.nombre.trim()) {
      errorNombre.hidden = false;
      inputNombre.setAttribute('aria-invalid', 'true');
      inputNombre.scrollIntoView({ behavior: 'smooth', block: 'center' });
      inputNombre.focus({ preventScroll: true });
      return;
    }
    if (respondidas() < TOTAL && !confirmoPendientes) {
      avisoPend.hidden = false;
      pintarProgreso();
      marcarPendientes();
      return;
    }
    avisoPend.hidden = true;
    marcarPendientes();
    enviar();
  }

  function enviar() {
    var datos = new URLSearchParams();
    datos.append(ENTRY_NOMBRE, estado.nombre.trim());
    datos.append(ENTRY_INTRO, (estado.intro || '').trim());
    AVENIDAS.forEach(function (av) {
      av.items.forEach(function (it) {
        if (estado.puntajes[it.entry]) datos.append(it.entry, estado.puntajes[it.entry]);
      });
      if (av.libre) datos.append(av.libre, (estado.libres[av.libre] || '').trim());
    });
    datos.append('fvv', '1');
    datos.append('pageHistory', '0');

    enviando = true;
    btnSubmit.disabled = true;
    btnSubmit.textContent = t('sending');
    avisoError.hidden = true;

    // Google Forms no expone CORS: la respuesta es opaca y no se puede leer el status.
    // Si fetch resuelve, el form recibió el envío; si rechaza, no hubo conexión.
    fetch(FORM_URL, { method: 'POST', mode: 'no-cors', body: datos, keepalive: true })
      .then(function () {
        if (window.posthog) posthog.capture('enviar_assessment_gdm', { idioma: idioma, completo: respondidas() === TOTAL });
        borrar(CLAVE_BORRADOR);
        mostrarGracias();
      })
      .catch(function (err) {
        console.error('No se pudo enviar el assessment', err);
        avisoError.hidden = false;
      })
      .then(function () {
        enviando = false;
        btnSubmit.disabled = false;
        btnSubmit.textContent = t('submit');
      });
  }

  function mostrarGracias() {
    document.getElementById('as-app').hidden = true;
    document.getElementById('as-thanks').hidden = false;
    window.scrollTo(0, 0);
    document.getElementById('as-thanks-title').focus();
  }

  document.getElementById('as-otra').addEventListener('click', function () {
    estado = { nombre: '', intro: '', puntajes: {}, libres: {} };
    confirmoPendientes = false;
    inputNombre.value = '';
    inputIntro.value = '';
    pintarAvenidas();
    pintarProgreso();
    document.getElementById('as-thanks').hidden = true;
    document.getElementById('as-app').hidden = false;
    window.scrollTo(0, 0);
    inputNombre.focus();
  });

  cargarBorrador();
  pintarTextos();
  pintarAvenidas();
})();
</script>
